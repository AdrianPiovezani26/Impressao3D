<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:4px;height:40px;border-radius:10px;overflow:hidden"><div style="flex:5;background:var(--chart-1);display:flex;align-items:flex-end;padding:6px 8px;font:500 11px var(--font-mono);color:#0B0B0D">1</div><div style="flex:4;background:var(--chart-2);display:flex;align-items:flex-end;padding:6px 8px;font:500 11px var(--font-mono);color:#fff">2</div><div style="flex:3;background:var(--chart-3);display:flex;align-items:flex-end;padding:6px 8px;font:500 11px var(--font-mono);color:#0B0B0D">3</div><div style="flex:2;background:var(--chart-4);display:flex;align-items:flex-end;padding:6px 8px;font:500 11px var(--font-mono);color:#fff">4</div><div style="flex:1;background:var(--chart-5);display:flex;align-items:flex-end;padding:6px 8px;font:500 11px var(--font-mono);color:#fff">5</div></div><div style="margin-top:12px;height:28px;border-radius:8px;background:linear-gradient(180deg,var(--chart-area-top),var(--chart-area-bottom));box-shadow:inset 0 2px 0 var(--emerald-400)"></div></body></html>

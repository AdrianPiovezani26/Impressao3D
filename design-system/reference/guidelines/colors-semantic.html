<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status colors — solid for text/icons, soft for fills" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="sw"><div><div class="chip" style="background:var(--success-soft);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--success);font:500 13px var(--font-sans)"><span style="width:10px;height:10px;border-radius:50%;background:var(--success)"></span>Success</div><span class="n">--success / --success-soft</span><span class="h">#2FCB7E</span></div><div><div class="chip" style="background:var(--danger-soft);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--danger);font:500 13px var(--font-sans)"><span style="width:10px;height:10px;border-radius:50%;background:var(--danger)"></span>Danger</div><span class="n">--danger / --danger-soft</span><span class="h">#FF6B6B</span></div><div><div class="chip" style="background:var(--warning-soft);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--warning);font:500 13px var(--font-sans)"><span style="width:10px;height:10px;border-radius:50%;background:var(--warning)"></span>Warning</div><span class="n">--warning / --warning-soft</span><span class="h">#FFC23D</span></div><div><div class="chip" style="background:var(--info-soft);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--info);font:500 13px var(--font-sans)"><span style="width:10px;height:10px;border-radius:50%;background:var(--info)"></span>Info</div><span class="n">--info / --info-soft</span><span class="h">#5AA9FF</span></div><div><div class="chip" style="background:var(--accent-soft);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-accent);font:500 13px var(--font-sans)"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></span>Accent</div><span class="n">--accent / --accent-soft</span><span class="h">#B8FE57</span></div></div></body></html>

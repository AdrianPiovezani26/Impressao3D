<!-- @dsCard group="Spacing" viewport="700x130" name="Motion" subtitle="Short, ease-out. No bounces. Hover the bars." -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}.m:hover .dot{left:calc(100% - 21px)!important}</style></head><body><div style="display:flex;flex-direction:column;gap:12px"><div class="m" style="display:flex;align-items:center;gap:14px"><span class="n" style="width:110px">--dur-fast · 120ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><div style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);transition:left 120ms var(--ease-out)" class="dot"></div></div><span class="h" style="width:150px">hover, press</span></div><div class="m" style="display:flex;align-items:center;gap:14px"><span class="n" style="width:110px">--dur-base · 180ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><div style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);transition:left 180ms var(--ease-out)" class="dot"></div></div><span class="h" style="width:150px">toggles, tabs</span></div><div class="m" style="display:flex;align-items:center;gap:14px"><span class="n" style="width:110px">--dur-slow · 280ms</span><div style="flex:1;height:24px;border-radius:999px;background:var(--surface-card);position:relative"><div style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);transition:left 280ms var(--ease-out)" class="dot"></div></div><span class="h" style="width:150px">sheets, dialogs, charts</span></div></div></body></html>

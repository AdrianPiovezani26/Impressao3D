<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base with 2/6/10 half-steps for dense UI" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:2px;height:2px;background:var(--accent);border-radius:2px"></div><span class="n">2</span><span class="h">0-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--accent);border-radius:2px"></div><span class="n">4</span><span class="h">1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:6px;height:6px;background:var(--accent);border-radius:2px"></div><span class="n">6</span><span class="h">1-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--accent);border-radius:2px"></div><span class="n">8</span><span class="h">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:10px;height:10px;background:var(--accent);border-radius:2px"></div><span class="n">10</span><span class="h">2-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--accent);border-radius:2px"></div><span class="n">12</span><span class="h">3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--accent);border-radius:2px"></div><span class="n">16</span><span class="h">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--accent);border-radius:2px"></div><span class="n">20</span><span class="h">5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--accent);border-radius:2px"></div><span class="n">24</span><span class="h">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--accent);border-radius:2px"></div><span class="n">32</span><span class="h">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:40px;background:var(--accent);border-radius:2px"></div><span class="n">40</span><span class="h">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:var(--accent);border-radius:2px"></div><span class="n">48</span><span class="h">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--accent);border-radius:2px"></div><span class="n">64</span><span class="h">16</span></div></div></body></html>

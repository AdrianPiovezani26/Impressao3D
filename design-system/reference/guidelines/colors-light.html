<!-- @dsCard group="Colors" viewport="700x150" name="Light theme" subtitle="[data-theme=light] — same roles, inverted surfaces" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}.n,.h{color:inherit}</style></head><body><div data-theme="light" style="background:var(--bg-app);border-radius:14px;padding:14px;display:flex;gap:10px;color:var(--text-primary)">
<div style="background:var(--surface-sidebar);border-radius:10px;padding:12px;width:140px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--card-border)"><span class="n">sidebar</span><span class="h">#FFFFFF</span></div>
<div style="flex:1;background:var(--surface-card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--card-border)"><span class="n">card</span><span style="font:var(--type-kpi);letter-spacing:-.02em">R$ 1.511.121</span><span style="font:500 12px var(--font-sans);color:var(--success)">↗ 32% vs trimestre</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center"><span style="background:var(--accent);color:var(--text-on-accent);height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:500 13px var(--font-sans)">Lime fill stays</span><span style="font:500 13px var(--font-sans);color:var(--text-accent);text-align:center">Lime text → lime-700</span></div></div></body></html>

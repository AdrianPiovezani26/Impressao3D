<!-- @dsCard group="Colors" viewport="700x120" name="Text & borders" subtitle="Four text levels; three hairline weights" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-primary);font:var(--type-body)">Primário — valores, títulos</span><span class="h">--text-primary</span></div><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-secondary);font:var(--type-body)">Secundário — rótulos, legendas</span><span class="h">--text-secondary</span></div><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-tertiary);font:var(--type-body)">Terciário — metadados, horários</span><span class="h">--text-tertiary</span></div><div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-accent);font:var(--type-body)">Acento — links, deltas positivos</span><span class="h">--text-accent</span></div></div>
<div style="display:flex;flex-direction:column;gap:12px;justify-content:center"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:0;border-top:1px solid var(--border-subtle)"></div><span class="h" style="width:110px">--border-subtle</span></div><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:0;border-top:1px solid var(--border-default)"></div><span class="h" style="width:110px">--border-default</span></div><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:0;border-top:1px solid var(--border-strong)"></div><span class="h" style="width:110px">--border-strong</span></div></div></div></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:10px}.n{font:500 11px/1.2 var(--font-sans);color:var(--text-primary)}.h{font:400 10px/1.2 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:20px;padding:10px 4px"><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-none)"></div><span class="n">none</span><span class="h">card</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-sm)"></div><span class="n">sm</span><span class="h">thumb · seg</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-md),inset 0 0 0 1px var(--border-default)"></div><span class="n">md</span><span class="h">menu</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--border-default)"></div><span class="n">lg</span><span class="h">dialog · toast</span></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:12px;background:var(--accent);box-shadow:var(--shadow-accent-glow)"></div><span class="n">accent-glow</span><span class="h">primary:hover</span></div></div></body></html>
